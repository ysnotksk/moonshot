# ci-kit v1 (ysnotksk/ci-kit): edit there and re-sync, not here.
name: Secret Scanning

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1" # Mondays 12:23 JST: whole-history scan
  workflow_dispatch:

# Explicit permissions are required for Dependabot-triggered runs, where the
# default GITHUB_TOKEN is read-only. gitleaks-action lists PR commits via the
# REST API, so it needs contents:read and pull-requests:read.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    # Skipped: Dependabot PRs (version bumps only) and pushes to main that land
    # a PR (squash "(#N)" or "Merge pull request #N"), which were scanned as the
    # PR. The weekly run covers the whole history, and the local pre-commit hook
    # stops secrets before they are committed.
    if: >-
      !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') &&
      !(github.event_name == 'push' && (contains(github.event.head_commit.message, '(#') ||
        startsWith(github.event.head_commit.message, 'Merge pull request #')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The weekly whole-history scan exists to catch secrets that slipped past
      # local hooks. A week with no new commits cannot contain a new leak, so
      # skip the scan step and pay only the seconds the job startup costs.
      - name: Check for recent commits
        id: recent
        if: github.event_name == 'schedule'
        run: |
          count=$(git rev-list --count HEAD --since='8 days ago')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "commits in the last 8 days: $count"

      - name: Run Gitleaks
        if: github.event_name != 'schedule' || steps.recent.outputs.count != '0'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
