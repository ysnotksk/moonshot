# ci-kit v1 (ysnotksk/ci-kit): edit there and re-sync, not here.
name: Secret Scanning

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1" # Mondays 12:23 JST: whole-history scan
  workflow_dispatch:

# Explicit permissions are required for Dependabot-triggered runs, where the
# default GITHUB_TOKEN is read-only. gitleaks-action lists PR commits via the
# REST API, so it needs contents:read and pull-requests:read. actions:read is
# used below to look up the previous scheduled run's head.
permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    # Skipped: Dependabot PRs (version bumps only) and pushes to main that land
    # a PR (squash "(#N)" or "Merge pull request #N"), which were scanned as the
    # PR. The weekly run covers the whole history, and the local pre-commit hook
    # stops secrets before they are committed.
    if: >-
      !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') &&
      !(github.event_name == 'push' && (contains(github.event.head_commit.message, '(#') ||
        startsWith(github.event.head_commit.message, 'Merge pull request #')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The weekly whole-history scan is the backstop for secrets that slipped
      # past local hooks. Skip it only when the last *successful* weekly run
      # already covered this exact head: any new commit changes head_sha
      # regardless of author/committer dates, and a failed or cancelled run
      # must be retried rather than skipped.
      - name: Skip when the last weekly scan covered this head
        id: gate
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/secret-scan.yml/runs?event=schedule&status=completed&per_page=1" \
            --jq '.workflow_runs[0] | "\(.conclusion) \(.head_sha)"' || true)
          echo "last scheduled run: ${last:-none}"
          if [ "${last:-}" = "success $(git rev-parse HEAD)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Gitleaks
        if: steps.gate.outputs.skip != 'true'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
