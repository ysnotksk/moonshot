name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.23.4', '24.22.1']

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint SCSS
        run: npx stylelint 'src/**/*.{css,scss}'

      - name: Build
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/moonshot.css || (echo "Missing moonshot.css" && exit 1)
          test -f dist/moonshot.min.css || (echo "Missing moonshot.min.css" && exit 1)
          git diff --exit-code -- dist examples

      # Keep the full audit blocking, while retaining lint/build evidence on failure.
      - name: Audit dependencies
        run: npm audit --audit-level=high
